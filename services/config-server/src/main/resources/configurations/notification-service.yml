spring:
  data:
    mongodb:
      host: localhost
      port: 27017
      database: notification
      username: micho
      password: micho
      authentication-database: admin
  kafka:
    consumer:
      bootstrap-servers: localhost:9092
      group-id: paymentGroup,orderGroup
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: '*'
        spring.json.type.mapping: orderConfirmation:com.mich.ecommerce.kafka.OrderConfirmation,paymentConfirmation:com.mich.ecommerce.notification.PaymentNotificationRequest

  mail:
    host: localhost
    port: 1025
    username: micho
    password: micho
    properties:
      mail:
        smtp:
          auth: true
          trust: "*"
          starttls:
            enable: true
        connectiontimeout: 5000
        timeout: 3000
        writetimeout: 5000

server:
  port: 8040