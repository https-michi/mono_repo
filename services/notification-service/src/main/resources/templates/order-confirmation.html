<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Confirmation</title>

    <style>
        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background-color: #f6f9fc;
            margin: 0;
            padding: 40px 20px;
            line-height: 1.6;
        }

        .email-wrapper {
            max-width: 700px;
            margin: 0 auto;
            background-color: #ffffff;
        }

        .header {
            background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
            padding: 40px;
            text-align: center;
        }

        .header h1 {
            color: #ffffff;
            margin: 0;
            font-size: 24px;
            font-weight: 600;
        }

        .content {
            padding: 40px;
        }

        .greeting {
            font-size: 16px;
            color: #1f2937;
            margin-bottom: 24px;
        }

        .summary-box {
            background-color: #f9fafb;
            border: 1px solid #e5e7eb;
            border-radius: 8px;
            padding: 24px;
            margin: 24px 0 32px;
        }

        .summary-row {
            display: table;
            width: 100%;
            margin-bottom: 12px;
        }

        .summary-row:last-child {
            margin-bottom: 0;
            padding-top: 12px;
            border-top: 2px solid #e5e7eb;
        }

        .summary-label {
            display: table-cell;
            color: #6b7280;
            font-size: 14px;
        }

        .summary-value {
            display: table-cell;
            color: #1f2937;
            font-size: 14px;
            font-weight: 600;
            text-align: right;
        }

        .amount {
            color: #6366f1;
            font-size: 22px;
            font-weight: 700;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 24px;
        }

        th {
            text-align: left;
            padding: 12px;
            background-color: #f3f4f6;
            font-size: 13px;
            color: #374151;
            border-bottom: 1px solid #e5e7eb;
        }

        td {
            padding: 12px;
            font-size: 14px;
            color: #4b5563;
            border-bottom: 1px solid #e5e7eb;
        }

        td:last-child, th:last-child {
            text-align: right;
        }

        .footer {
            background-color: #f9fafb;
            padding: 30px 40px;
            text-align: center;
            border-top: 1px solid #e5e7eb;
        }

        .footer p {
            color: #9ca3af;
            font-size: 13px;
            margin: 6px 0;
        }

        .brand {
            color: #6366f1;
            font-weight: 600;
        }

        @media only screen and (max-width: 600px) {
            .content {
                padding: 30px 24px;
            }

            .header {
                padding: 30px 24px;
            }

            .footer {
                padding: 24px 20px;
            }
        }
    </style>
</head>

<body>
<div class="email-wrapper">

    <div class="header">
        <h1>Order Confirmation</h1>
    </div>

    <div class="content">
        <p class="greeting">
            Hello <span th:text="${customerName}"></span>,
        </p>

        <p>
            Thank you for your order. Below you will find the details of your purchase.
        </p>

        <div class="summary-box">
            <div class="summary-row">
                <span class="summary-label">Order Reference</span>
                <span class="summary-value" th:text="${orderReference}"></span>
            </div>
            <div class="summary-row">
                <span class="summary-label">Total Amount</span>
                <span class="summary-value amount">
                    $<span th:text="${totalAmount}"></span>
                </span>
            </div>
        </div>

        <table>
            <thead>
            <tr>
                <th>Product</th>
                <th>Quantity</th>
                <th>Price</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="product : ${products}">
                <td th:text="${product.name}"></td>
                <td th:text="${product.quantity}"></td>
                <td>
                    $<span th:text="${product.price}"></span>
                </td>
            </tr>
            </tbody>
        </table>
    </div>

    <div class="footer">
        <p>This is an automated confirmation. Please do not reply to this email.</p>
        <p class="brand">michiou</p>
        <p>&copy; 2024 All rights reserved.</p>
    </div>

</div>
</body>
</html>
